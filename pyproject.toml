[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "android-agent-harness"
version = "1.2.4"
description = "Approval-first, evidence-bound engineering harness for Android and KMM/KMP (Kotlin Multiplatform Mobile) projects on Google Antigravity."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rabee Elkholy" }]
keywords = ["android", "kmm", "kmp", "kotlin-multiplatform", "antigravity", "ai-agents", "code-review", "governance", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/rabee-elkholy/android-agent-harness"
Issues = "https://github.com/rabee-elkholy/android-agent-harness/issues"
Source = "https://github.com/rabee-elkholy/android-agent-harness"
Documentation = "https://github.com/rabee-elkholy/android-agent-harness/tree/main/docs"
Changelog = "https://github.com/rabee-elkholy/android-agent-harness/blob/main/CHANGELOG.md"
Security = "https://github.com/rabee-elkholy/android-agent-harness/blob/main/SECURITY.md"

[project.scripts]
android-harness = "harness_cli:main"

[tool.setuptools]
py-modules = ["harness_cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]
namespaces = true

[tool.setuptools.package-data]
"agents" = [
    "harness.py",
    "VERSION",
    "release_checksums.json",
    ".gitignore",
    "hooks.json",
    "mcp_config.json",
    "settings.json",
    "command-packs/*",
    "pm/*",
    "rules/*",
    "skills/**/*",
    "subagents/*",
    "tool-adapters/*",
    "tool-adapters/**/*",
    "workflows/*"
]
