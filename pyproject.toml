[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-agent-harness"
version = "1.0.19"
description = "Approval-first, evidence-bound development harness for supported Gradle Android projects."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rabee Elkholy" }]
keywords = ["android", "kmp", "ai-agents", "code-review", "governance", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/rabee-elkholy/android-agent-harness"
Issues = "https://github.com/rabee-elkholy/android-agent-harness/issues"

[project.scripts]
android-harness = "harness_cli:main"

[tool.setuptools]
py-modules = ["harness_cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]
namespaces = true

[tool.setuptools.package-data]
"agents" = [
    "VERSION",
    "release_checksums.json",
    ".gitignore",
    "hooks.json",
    "mcp_config.json",
    "settings.json",
    "command-packs/*",
    "pm/*",
    "rules/*",
    "skills/**/*",
    "subagents/*",
    "tool-adapters/*",
    "workflows/*"
]
"agents.mcp.zoho_sprints" = ["*.json", "*.md"]
