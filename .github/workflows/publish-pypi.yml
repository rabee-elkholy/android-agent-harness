name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Build and Upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify release tag matches version
        run: |
          TAG_VER="${{ github.event.release.tag_name }}"
          PKG_VER=$(cat agents/VERSION | tr -d '[:space:]')
          if [ "${TAG_VER#v}" != "$PKG_VER" ]; then
            echo "::error::Release tag '$TAG_VER' does not match agents/VERSION '$PKG_VER'"
            exit 1
          fi
          echo "Tag $TAG_VER matches package version $PKG_VER"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build==1.6.0 twine==7.0.0

      - name: Build package distributions
        run: python -m build

      - name: Verify package metadata
        run: python -m twine check dist/*

      - name: Validate release integrity
        run: python scripts_dev/validate_release.py

      - name: Require successful CI and tag validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, "scripts_dev")
          from release_version import wait_for_workflow
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if not wait_for_workflow("ci.yml", sha):
              raise SystemExit("CI must pass for the release commit before uploading")
          if not wait_for_workflow("release-check.yml", sha, branch=os.environ["RELEASE_TAG"]):
              raise SystemExit("Release validation must pass for the release tag before uploading")
          PY

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
