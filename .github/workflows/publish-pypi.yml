name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  pypi-publish:
    name: Build and Upload to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release tag matches version
        run: |
          TAG_VER="${{ github.event.release.tag_name }}"
          PKG_VER=$(cat agents/VERSION | tr -d '[:space:]')
          if [ "${TAG_VER#v}" != "$PKG_VER" ]; then
            echo "::error::Release tag '$TAG_VER' does not match agents/VERSION '$PKG_VER'"
            exit 1
          fi
          echo "Tag $TAG_VER matches package version $PKG_VER"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install build==1.6.0 twine==7.0.0 setuptools==80.9.0 wheel==0.45.1

      - name: Build package distributions
        run: python -m build --no-isolation

      - name: Verify package metadata
        run: python -m twine check dist/*

      - name: Validate release integrity
        run: python scripts_dev/validate_release.py

      - name: Require successful CI and tag validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, "scripts_dev")
          from release_version import wait_for_workflow
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if not wait_for_workflow("ci.yml", sha):
              raise SystemExit("CI must pass for the release commit before uploading")
          if not wait_for_workflow("release-check.yml", sha, branch=os.environ["RELEASE_TAG"]):
              raise SystemExit("Release validation must pass for the release tag before uploading")
          PY

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
