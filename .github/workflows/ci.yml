name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    name: Self-Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2025, macos-15-intel ]
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run vNext architecture tests
        run: |
          python -m unittest agents/scripts/_vnext_selftest.py -v

      - name: Run host safety hook tests
        run: |
          python agents/scripts/_hook_selftest.py

      - name: Run adversarial security tests
        run: |
          python agents/scripts/_security_selftest.py

      - name: Run Zoho compatibility and idempotency tests
        run: |
          python agents/scripts/_zoho_selftest.py

      - name: Run ADB core tests
        run: |
          python agents/scripts/_adb_core_selftest.py

      - name: Run environment failure classifier tests
        run: |
          python agents/scripts/_env_codes_selftest.py

      - name: Run baseline and graph compatibility tests
        run: |
          python agents/scripts/_baseline_selftest.py
          python agents/scripts/_graph_selftest.py

      - name: Run Project Intelligence regressions
        run: python agents/scripts/_project_intelligence_selftest.py

      - name: Run Android scenario regression matrix
        run: |
          python agents/scripts/_android_scenarios_selftest.py

      - name: Run release safety regressions
        run: python agents/scripts/_release_safety_selftest.py

      - name: Run critical safety regressions
        run: python agents/scripts/_critical_safety_selftest.py

      - name: Run public CLI acceptance tests
        run: python agents/scripts/_public_cli_selftest.py

      - name: Compile Python sources
        run: |
          python -m compileall -q agents/scripts agents/mcp/zoho_sprints harness_cli.py

      - name: Smoke Standalone CLI Dispatcher
        env:
          _IN_HOOK_SELFTEST: '1'
        run: |
          python harness_cli.py version
          python harness_cli.py doctor --json

  full-selftest:
    name: Canonical full selftest (Python 3.12 on Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run canonical full selftest
        run: python harness_cli.py selftest

  performance:
    name: Performance regression budget
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run performance tripwire
        run: python agents/scripts/_performance_selftest.py

  release-lifecycle:
    name: Wheel lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2025, macos-15-intel ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned wheel build backend
        run: python -m pip install --disable-pip-version-check setuptools==80.9.0 wheel==0.45.1
      - name: Build wheel
        env:
          PIP_NO_INDEX: '1'
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Validate installed wheel lifecycle
        env:
          PIP_NO_INDEX: '1'
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: python scripts_dev/release_lifecycle_smoke.py --wheel-dir dist

  release-metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate release-controlled metadata
        run: python scripts_dev/validate_release.py
