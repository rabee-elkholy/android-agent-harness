name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selftest:
    name: Self-Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Core Safety & Hook Self-Tests
        run: |
          python agents/scripts/_hook_selftest.py

      - name: Run Adversarial Security Self-Tests (B1)
        run: |
          python agents/scripts/_security_selftest.py

      - name: Run Preflight Sanity Verification
        run: |
          python agents/scripts/preflight_check.py

      - name: Smoke Standalone CLI Dispatcher
        env:
          _IN_HOOK_SELFTEST: '1'
        run: |
          python harness_cli.py version
          python harness_cli.py doctor --json