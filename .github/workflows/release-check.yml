name: Release Validation

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-tag:
    name: Validate Release Version & Changelog (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate Version Alignment
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python -c "
          import os
          from pathlib import Path
          ver = Path('agents/VERSION').read_text().strip()
          tag = os.environ.get('REF_NAME', '').lstrip('v')
          assert ver == tag, f'agents/VERSION ({ver}) does not match tag ({tag})'
          pyproject = Path('pyproject.toml').read_text(encoding='utf-8')
          assert f'version = \"{ver}\"' in pyproject, f'pyproject.toml version does not match agents/VERSION ({ver})'
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          assert f'[{ver}]' in changelog, f'Version {ver} not found in CHANGELOG.md'
          print(f'Release version {ver} is valid and aligned.')
          "
