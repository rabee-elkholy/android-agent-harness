<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0E1422"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect width="1200" height="360" rx="16" fill="url(#hero-bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Ambient Lighting -->
  <circle cx="150" cy="180" r="140" fill="#3DDC84" opacity="0.08" filter="url(#subtle-glow)"/>
  <circle cx="1050" cy="180" r="140" fill="#818CF8" opacity="0.08" filter="url(#subtle-glow)"/>

  <!-- Left Geometric Brand Shield Icon -->
  <g transform="translate(100, 110)">
    <!-- Outer Shield Outline -->
    <path d="M70 10 L130 35 L130 95 C130 135 70 160 70 160 C70 160 10 135 10 95 L10 35 Z" fill="#0F172A" stroke="url(#shield-grad)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Inner Android Robot Head Geometric Silhouette -->
    <path d="M40 70 C40 52 53 38 70 38 C87 38 100 52 100 70 Z" fill="#3DDC84"/>
    <!-- Antennas -->
    <line x1="50" y1="36" x2="42" y2="24" stroke="#3DDC84" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="36" x2="98" y2="24" stroke="#3DDC84" stroke-width="3" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="56" cy="56" r="3.5" fill="#0F172A"/>
    <circle cx="84" cy="56" r="3.5" fill="#0F172A"/>
    
    <!-- Geometric Quality Node Network -->
    <circle cx="70" cy="105" r="5" fill="#38BDF8"/>
    <circle cx="45" cy="120" r="4" fill="#818CF8"/>
    <circle cx="95" cy="120" r="4" fill="#818CF8"/>
    <line x1="70" y1="105" x2="45" y2="120" stroke="#334155" stroke-width="2"/>
    <line x1="70" y1="105" x2="95" y2="120" stroke="#334155" stroke-width="2"/>
    <line x1="70" y1="80" x2="70" y2="105" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Typography Content Area -->
  <g transform="translate(280, 0)">
    <!-- Top System Tag -->
    <g transform="translate(0, 75)">
      <rect width="210" height="28" rx="14" fill="#0F172A" stroke="#3DDC84" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="4" fill="#3DDC84"/>
      <text x="32" y="19" fill="#3DDC84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">ANDROID AGENT HARNESS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.8">
      Deterministic Android Engineering
    </text>
    <text x="0" y="195" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.8">
      for the AI Era
    </text>

    <!-- Subtitle -->
    <text x="0" y="235" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Turn Any AI Assistant into an Uncompromising Senior Android Engineering Team.
    </text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 268)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="32" rx="8" fill="#131D31" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="21" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">6-Leaf Parallel Review</text>

      <!-- Pill 2 -->
      <rect x="182" y="0" width="185" height="32" rx="8" fill="#131D31" stroke="#1E293B" stroke-width="1"/>
      <text x="196" y="21" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Deterministic OS Hooks</text>

      <!-- Pill 3 -->
      <rect x="379" y="0" width="175" height="32" rx="8" fill="#131D31" stroke="#1E293B" stroke-width="1"/>
      <text x="393" y="21" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Autonomous Device QA</text>

      <!-- Pill 4 -->
      <rect x="566" y="0" width="165" height="32" rx="8" fill="#131D31" stroke="#1E293B" stroke-width="1"/>
      <text x="580" y="21" fill="#3DDC84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Kotlin &amp; Compose</text>
    </g>
  </g>
</svg>
