<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A11"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#06090F"/>
    </linearGradient>
    <linearGradient id="glow-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Glowing Aura Backdrops -->
  <circle cx="240" cy="180" r="220" fill="#3DDC84" opacity="0.16" filter="url(#glow)"/>
  <circle cx="1040" cy="220" r="240" fill="#6366F1" opacity="0.18" filter="url(#glow)"/>
  <circle cx="640" cy="500" r="220" fill="#0EA5E9" opacity="0.12" filter="url(#glow)"/>

  <!-- Top System Badge -->
  <g transform="translate(640, 95)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#0F172A" stroke="#3DDC84" stroke-width="2"/>
    <circle cx="-155" cy="0" r="6" fill="#3DDC84"/>
    <text text-anchor="middle" x="10" y="7" fill="#3DDC84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="2">ANDROID AGENT HARNESS</text>
  </g>

  <!-- Main Hero Headlines (Large, Ultra-Bold) -->
  <text x="640" y="195" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    Deterministic Android Engineering
  </text>
  <text x="640" y="265" text-anchor="middle" fill="url(#glow-text)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    for the AI Era
  </text>

  <!-- Tagline (High Contrast, Large) -->
  <text x="640" y="325" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.2">
    Turn Any AI Assistant into an Uncompromising Senior Android Engineering Team.
  </text>

  <!-- 3 Core Architectural Pillars (Large High-Impact Badges) -->
  <g transform="translate(640, 410)">
    <!-- Pillar 1: 6 Quality Guardians -->
    <g transform="translate(-360, 0)">
      <rect x="-160" y="-38" width="320" height="76" rx="16" fill="url(#badge-bg)" stroke="#334155" stroke-width="1.5"/>
      <circle cx="-120" cy="0" r="10" fill="#3DDC84"/>
      <text x="-95" y="-6" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">6 Quality Guardians</text>
      <text x="-95" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Parallel Review Gate</text>
    </g>

    <!-- Pillar 2: Deterministic OS Hooks -->
    <g transform="translate(0, 0)">
      <rect x="-160" y="-38" width="320" height="76" rx="16" fill="url(#badge-bg)" stroke="#38BDF8" stroke-width="1.8"/>
      <circle cx="-120" cy="0" r="10" fill="#38BDF8"/>
      <text x="-95" y="-6" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">Deterministic OS Hooks</text>
      <text x="-95" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Cryptographic Delivery Cage</text>
    </g>

    <!-- Pillar 3: Targeted E2E Smoke -->
    <g transform="translate(360, 0)">
      <rect x="-160" y="-38" width="320" height="76" rx="16" fill="url(#badge-bg)" stroke="#818CF8" stroke-width="1.5"/>
      <circle cx="-120" cy="0" r="10" fill="#818CF8"/>
      <text x="-95" y="-6" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">Targeted E2E Smoke</text>
      <text x="-95" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Autonomous Device QA</text>
    </g>
  </g>

  <!-- Bottom Compatibility Strip -->
  <g transform="translate(640, 535)">
    <rect x="-560" y="-24" width="1120" height="48" rx="12" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.2"/>
    <text x="-530" y="6" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">COMPATIBLE WITH</text>
    <text x="-370" y="6" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Cursor • Claude Code • Gemini • Antigravity • Copilot • Windsurf • Cline</text>
    <text x="440" y="6" fill="#3DDC84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1">KOTLIN &amp; COMPOSE</text>
  </g>
</svg>
