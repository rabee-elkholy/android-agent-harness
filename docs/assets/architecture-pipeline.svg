<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="pipe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0D1322"/>
    </linearGradient>
    <linearGradient id="box-lead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="box-guard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142823"/>
      <stop offset="100%" stop-color="#0B1A16"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3DDC84"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="16" fill="url(#pipe-bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Pipeline Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">DETERMINISTIC EXECUTION PIPELINE</text>
    <text x="0" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">From AI Prompt to Verified Physical Device Delivery</text>
  </g>

  <!-- Stage 1: Lead Agent -->
  <g transform="translate(60, 110)">
    <rect width="190" height="310" rx="12" fill="url(#box-lead)" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="160" height="28" rx="6" fill="#1E293B"/>
    <text x="95" y="34" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">1. LEAD AGENT</text>
    
    <text x="20" y="75" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">AI Coding Assistant</text>
    <text x="20" y="105" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <tspan x="20" dy="0">• Cursor / Claude Code</tspan>
      <tspan x="20" dy="20">• Gemini / Antigravity</tspan>
      <tspan x="20" dy="20">• Copilot / Windsurf</tspan>
    </text>

    <line x1="20" y1="175" x2="170" y2="175" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="200" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Action Request</text>
    <text x="20" y="225" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      <tspan x="20" dy="0">Writes code, runs</tspan>
      <tspan x="20" dy="16">tests, generates</tspan>
      <tspan x="20" dy="16">immutable review diff</tspan>
    </text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="255" y1="265" x2="285" y2="265" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: OS Safety Interceptor -->
  <g transform="translate(290, 110)">
    <rect width="200" height="310" rx="12" fill="url(#box-lead)" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="15" y="15" width="170" height="28" rx="6" fill="#0369A1" fill-opacity="0.3"/>
    <text x="100" y="34" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">2. OS INTERCEPTOR</text>

    <text x="20" y="75" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">PreToolUse Engine</text>
    <text x="20" y="105" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <tspan x="20" dy="0">• Denies `git commit`</tspan>
      <tspan x="20" dy="20">• Denies `push --force`</tspan>
      <tspan x="20" dy="20">• Denies bare ADB &amp; pm</tspan>
      <tspan x="20" dy="20">• Locks `:assembleDebug`</tspan>
    </text>

    <line x1="20" y1="195" x2="180" y2="195" stroke="#334155" stroke-width="1"/>
    <rect x="20" y="210" width="160" height="42" rx="6" fill="#0C4A6E" fill-opacity="0.4" stroke="#0284C7" stroke-width="1"/>
    <text x="100" y="236" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Deterministic OS Hook</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="495" y1="265" x2="525" y2="265" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: 6 Parallel Quality Guardians -->
  <g transform="translate(530, 110)">
    <rect width="250" height="310" rx="12" fill="url(#box-guard)" stroke="#3DDC84" stroke-width="1.8"/>
    <rect x="15" y="15" width="220" height="28" rx="6" fill="#064E3B" fill-opacity="0.5"/>
    <text x="125" y="34" text-anchor="middle" fill="#3DDC84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">3. 6 QUALITY GUARDIANS</text>

    <g transform="translate(18, 65)">
      <!-- 1 -->
      <rect width="214" height="28" rx="4" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="0.8"/>
      <text x="10" y="18" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">bug-reviewer-agent</text>
      <!-- 2 -->
      <rect y="36" width="214" height="28" rx="4" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="0.8"/>
      <text x="10" y="54" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">convention-reviewer-agent</text>
      <!-- 3 -->
      <rect y="72" width="214" height="28" rx="4" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="0.8"/>
      <text x="10" y="90" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">security-reviewer-agent</text>
      <!-- 4 -->
      <rect y="108" width="214" height="28" rx="4" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="0.8"/>
      <text x="10" y="126" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">perf-anr-guardian-agent</text>
      <!-- 5 -->
      <rect y="144" width="214" height="28" rx="4" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="0.8"/>
      <text x="10" y="162" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">regression-impact-reviewer</text>
      <!-- 6 -->
      <rect y="180" width="214" height="28" rx="4" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="0.8"/>
      <text x="10" y="198" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">test-quality-reviewer-agent</text>
    </g>
    <text x="125" y="295" text-anchor="middle" fill="#3DDC84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">PARALLEL VERIFICATION</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="785" y1="265" x2="815" y2="265" stroke="#3DDC84" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Stage 4: Cryptographic Gate -->
  <g transform="translate(820, 110)">
    <rect width="150" height="310" rx="12" fill="url(#box-lead)" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="12" y="15" width="126" height="28" rx="6" fill="#3730A3" fill-opacity="0.4"/>
    <text x="75" y="34" text-anchor="middle" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">4. CRYPTO GATE</text>

    <text x="15" y="80" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">SHA-256 Ledger</text>
    <text x="15" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      <tspan x="15" dy="0">• Matches diff hash</tspan>
      <tspan x="15" dy="18">• Validates 6 footers</tspan>
      <tspan x="15" dy="18">• Unlocks Assemble</tspan>
    </text>

    <circle cx="75" cy="220" r="32" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <text x="75" y="225" text-anchor="middle" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">UNLOCKED</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="975" y1="265" x2="1005" y2="265" stroke="#3DDC84" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Stage 5: Target App & E2E Smoke -->
  <g transform="translate(1010, 110)">
    <rect width="130" height="310" rx="12" fill="url(#box-lead)" stroke="#3DDC84" stroke-width="1.5"/>
    <rect x="10" y="15" width="110" height="28" rx="6" fill="#064E3B" fill-opacity="0.5"/>
    <text x="65" y="34" text-anchor="middle" fill="#3DDC84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">5. DEVICE E2E</text>

    <text x="12" y="80" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Target Delivery</text>
    <text x="12" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      <tspan x="12" dy="0">• `:assembleDebug`</tspan>
      <tspan x="12" dy="18">• Phone / AVD run</tspan>
      <tspan x="12" dy="18">• Diff-aware E2E</tspan>
      <tspan x="12" dy="18">• Logcat Forensics</tspan>
      <tspan x="12" dy="18">• Screenshot Proof</tspan>
    </text>

    <rect x="12" y="245" width="106" height="36" rx="6" fill="#064E3B" stroke="#3DDC84" stroke-width="1"/>
    <text x="65" y="268" text-anchor="middle" fill="#3DDC84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">SHIPPED</text>
  </g>
</svg>
