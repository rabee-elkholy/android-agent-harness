<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <linearGradient id="pipe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0E1422"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131D31"/>
      <stop offset="100%" stop-color="#0D1524"/>
    </linearGradient>
    <marker id="pipe-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3DDC84"/>
    </marker>
  </defs>

  <!-- Background Frame -->
  <rect width="1200" height="220" rx="16" fill="url(#pipe-bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- STAGE 1: Lead Agent -->
  <g transform="translate(45, 45)">
    <rect width="195" height="130" rx="12" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Number Icon -->
    <circle cx="30" cy="32" r="13" fill="#0A0F1D" stroke="#3DDC84" stroke-width="1.5"/>
    <text x="30" y="37" text-anchor="middle" fill="#3DDC84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">1</text>
    <text x="54" y="37" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PROMPT</text>
    
    <text x="20" y="82" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Lead AI Agent</text>
    <text x="20" y="106" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Plan &amp; Code Diff</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="246" y1="110" x2="269" y2="110" stroke="#3DDC84" stroke-width="1.8" marker-end="url(#pipe-arrow)"/>

  <!-- STAGE 2: OS Interceptor -->
  <g transform="translate(275, 45)">
    <rect width="195" height="130" rx="12" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Number Icon -->
    <circle cx="30" cy="32" r="13" fill="#0A0F1D" stroke="#3DDC84" stroke-width="1.5"/>
    <text x="30" y="37" text-anchor="middle" fill="#3DDC84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">2</text>
    <text x="54" y="37" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SAFETY</text>

    <text x="20" y="82" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">OS Interceptor</text>
    <text x="20" y="106" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">PreTool Safety Hooks</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="476" y1="110" x2="499" y2="110" stroke="#3DDC84" stroke-width="1.8" marker-end="url(#pipe-arrow)"/>

  <!-- STAGE 3: 5 Quality Guardians -->
  <g transform="translate(505, 45)">
    <rect width="195" height="130" rx="12" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Number Icon -->
    <circle cx="30" cy="32" r="13" fill="#0A0F1D" stroke="#3DDC84" stroke-width="1.5"/>
    <text x="30" y="37" text-anchor="middle" fill="#3DDC84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">3</text>
    <text x="54" y="37" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">REVIEW</text>

    <text x="20" y="82" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">5 Quality Guardians</text>
    <text x="20" y="106" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Parallel Review Gate</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="706" y1="110" x2="729" y2="110" stroke="#3DDC84" stroke-width="1.8" marker-end="url(#pipe-arrow)"/>

  <!-- STAGE 4: Cryptographic Gate -->
  <g transform="translate(735, 45)">
    <rect width="195" height="130" rx="12" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Number Icon -->
    <circle cx="30" cy="32" r="13" fill="#0A0F1D" stroke="#3DDC84" stroke-width="1.5"/>
    <text x="30" y="37" text-anchor="middle" fill="#3DDC84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">4</text>
    <text x="54" y="37" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">VERIFY</text>

    <text x="20" y="82" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Crypto Gate</text>
    <text x="20" y="106" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">SHA-256 Verified</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="936" y1="110" x2="959" y2="110" stroke="#3DDC84" stroke-width="1.8" marker-end="url(#pipe-arrow)"/>

  <!-- STAGE 5: Target App & E2E Smoke -->
  <g transform="translate(965, 45)">
    <rect width="195" height="130" rx="12" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Number Icon -->
    <circle cx="30" cy="32" r="13" fill="#0A0F1D" stroke="#3DDC84" stroke-width="1.5"/>
    <text x="30" y="37" text-anchor="middle" fill="#3DDC84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">5</text>
    <text x="54" y="37" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DELIVER</text>

    <text x="20" y="82" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Device Delivery</text>
    <text x="20" y="106" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Targeted E2E Smoke</text>
  </g>
</svg>
